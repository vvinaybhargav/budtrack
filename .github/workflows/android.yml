name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.7

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # Before the build, so a broken money rule fails here rather than on a
    # phone. The rules in Ledger and SmsParser are covered; nothing else can be
    # tested without a device.
    - name: Run Unit Tests
      run: ./gradlew testReleaseUnitTest

    # Release, not debug. A debug APK is marked debuggable, which Play Protect
    # treats as a far stronger warning sign — and an unknown app that asks to
    # read SMS is already the shape of thing it looks for. Same signing key
    # either way, so this still installs over an existing build.
    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fintrack-release-apk
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 7

    - name: Generate IST Timestamped APK Name
      run: |
        export TZ='Asia/Kolkata'
        TIMESTAMP=$(date +'%b%d-%H%M-IST')
        cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/FinTrack-${TIMESTAMP}.apk
        echo "BUILD_TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV

    - name: Publish APK to GitHub Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "app/build/outputs/apk/release/FinTrack-*.apk"
        tag: "latest"
        allowUpdates: true
        name: "FinTrack IST Build (${{ env.BUILD_TIMESTAMP }})"
        body: "Latest FinTrack APK build (${{ env.BUILD_TIMESTAMP }} IST)."
